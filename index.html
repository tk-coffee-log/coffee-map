<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee Map 神奈川</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="T/K Coffee Log が紹介した神奈川の珈琲屋をエリアから探せるアプリ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=DM+Mono:wght@400;500&display=swap">
<style>
/* Layout: スマホ1画面アプリ。上にエリアと絞り込み、中身はリスト、下にタブ。店の詳細は全面パネル */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --ink:#241A13; --muted:#6A645C; --line:#D9D9D1;
  --roast:#6B3E26; --roast-soft:#EFE3D9; --leaf:#2E7A57; --warn:#A86A12;
  --mine-fill:#F7EFDD; --mine-line:#C9A25A;
  --map:#E5E9E1; --road:#FFFFFF; --park:#CDE2CC; --water:#C8DAE6;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"DM Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151311; --surface:#1F1B18; --ink:#EEE7DF; --muted:#A79D93; --line:#38322C;
  --roast:#D59D70; --roast-soft:#3A2A20; --leaf:#62C493; --warn:#E0A84A;
  --mine-fill:#30271A; --mine-line:#8E6C34;
  --map:#24272A; --road:#3B3F44; --park:#27392D; --water:#22323E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151311; --surface:#1F1B18; --ink:#EEE7DF; --muted:#A79D93; --line:#38322C;
  --roast:#D59D70; --roast-soft:#3A2A20; --leaf:#62C493; --warn:#E0A84A;
  --mine-fill:#30271A; --mine-line:#8E6C34;
  --map:#24272A; --road:#3B3F44; --park:#27392D; --water:#22323E; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65}
.app{max-width:560px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--surface);position:relative}
button{font:inherit;color:inherit}
a{color:var(--roast)}
:focus-visible{outline:2px solid var(--leaf);outline-offset:2px}

/* header */
.top{flex:none;padding-top:10px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:baseline;gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.logo{font-family:var(--f-display);font-size:20px;color:var(--roast);letter-spacing:.02em}
.sub{font-size:12px;color:var(--muted)}
.areas{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding:8px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px))}
.areas::-webkit-scrollbar{display:none}
.area{flex:none;border:0;border-bottom:2px solid transparent;background:none;color:var(--muted);padding:6px 10px;font-size:14px;cursor:pointer;white-space:nowrap}
.area[aria-pressed="true"]{color:var(--ink);font-weight:700;border-bottom-color:var(--roast)}
.area small{font-family:var(--f-mono);font-size:11px;margin-left:3px;color:var(--muted);font-weight:400}
.chips{display:flex;gap:6px;flex-wrap:wrap;padding:0 max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip.pick{border-color:var(--mine-line)}
.chip[aria-pressed="true"]{background:var(--roast);border-color:var(--roast);color:var(--surface)}

/* main */
main{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.count{font-size:12px;color:var(--muted);padding:10px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.item{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:start;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));cursor:pointer}
.item:active{background:var(--roast-soft)}
.nm{font-weight:700;font-size:15.5px;line-height:1.45}
.badge{display:inline-block;font-size:11px;font-weight:700;line-height:1.5;border-radius:4px;padding:0 5px;color:var(--warn);margin-left:6px;vertical-align:2px;background:var(--mine-fill);border:1px solid var(--mine-line)}
.fav-mark{color:var(--roast);margin-left:4px;font-size:13px}
.meta{font-size:12.5px;color:var(--muted);line-height:1.55}
.catch{font-size:13px;line-height:1.55;margin-top:2px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.itags{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:4px}
.itag{font-size:11px;line-height:1.6;border:1px solid var(--line);border-radius:999px;padding:0 8px;color:var(--muted)}
.item > span{min-width:0}
.memo{font-size:13px;line-height:1.6;margin-top:3px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.dist{padding-top:3px;font-family:var(--f-mono);font-size:11.5px;color:var(--muted);text-align:right;white-space:nowrap;line-height:1.6;font-variant-numeric:tabular-nums}
.empty{padding:32px max(16px,env(safe-area-inset-right,0px)) 32px max(16px,env(safe-area-inset-left,0px));color:var(--muted);font-size:14px;text-align:center}
.notice{margin:12px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px));font-size:12px;color:var(--muted);background:var(--bg);border-radius:8px;padding:8px 10px}

/* map (Leaflet + 地理院タイル) */
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {

.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {
	border: 2px dotted #38f;
	background: rgba(255,255,255,0.5);
	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;

	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}

	}

	border-bottom-right-radius: 4px;
	border-bottom: none;
	}
.leaflet-bar a.leaflet-disabled {

	background-color: #f4f4f4;

	}

.leaflet-touch .leaflet-bar a {
	width: 30px;
	height: 30px;

	}

	}

	}

	}

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

	}

	}

state.area=store.get("cm-area","鎌倉"); if(!AREAS.includes(state.area)) state.area="鎌倉";

const txt=s=>s.t.join(" ")+s.m;
const FILTERS={pick:s=>!!s.f,nel:s=>/ネル/.test(txt(s)),deep:s=>/深煎り/.test(txt(s)),beans:s=>/豆販売|豆を買|注文焙煎/.test(txt(s))};
const passF=s=>Object.entries(state.f).every(([k,on])=>!on||FILTERS[k](s));
const inArea=s=>state.area==="すべて"||s.a===state.area;
const walkMin=s=>s.walk==="バス"?90:(+((s.walk.match(/\d+/)||[0])[0]));
const order=l=>l.slice().sort((a,b)=>(!!a.u-!!b.u)||(!!b.f-!!a.f)||walkMin(a)-walkMin(b));
const station=s=>{const m=s.acc.match(/(?:JR|京急)?「?([^\s「」・/]+?駅)/);return m?m[1]:""};
const walkTxt=s=>s.walk||(/直通|直結/.test(s.acc)?"駅直結":"");
const q=s=>encodeURIComponent(`${s.n} ${s.ad.startsWith("（")?s.a:s.ad}`);
const mapsURL=s=>`https://www.google.com/maps/search/?api=1&query=${q(s)}`;
const dirURL=s=>`https://www.google.com/maps/dir/?api=1&destination=${q(s)}`;

function itemHTML(s){
  const n=numbered()?areaShops().indexOf(s)+1:0;
  return `<button class="item${n?" with-num":""}" data-shop="${s.id}">
    ${n?`<span class="num${s.u?" unv":""}">${n}</span>`:""}<span><span class="nm">${esc(s.n)}</span>${s.f?`<span class="badge" title="${esc(s.f)}">★</span>`:""}${s.u&&s.lat==null?`<span class="nopos">地図なし</span>`:""}${favs.has(s.id)?`<span class="fav-mark" aria-label="お気に入り">♥</span>`:""}<br>
      <span class="catch">${esc(s.m)}</span>
      <span class="itags"><span class="meta">${esc(state.area==="すべて"||state.tab==="favorites"?s.a:s.z.split("・")[0])}</span>${s.t.slice(0,2).map(x=>`<span class="itag">${esc(x)}</span>`).join("")}</span></span>
    <span class="dist">${esc(walkTxt(s))}</span>
  </button>`;
}
function renderAreas(){
  $("areas").innerHTML=AREAS.map(a=>{
    const n=a==="すべて"?shops.length:shops.filter(s=>s.a===a).length;
    return `<button class="area" data-area="${esc(a)}" aria-pressed="${a===state.area}">${esc(a)}<small>${n}</small></button>`}).join("");
}
function renderList(){
  const vis=order(shops.filter(s=>inArea(s)&&passF(s)));
  updateMap(vis);
  const mine=vis.filter(s=>!s.u), unv=vis.filter(s=>s.u);
  $("content").innerHTML=`<p class="count">T/Kが紹介した店 ${mine.length}軒</p>`+
    (mine.length?mine.map(itemHTML).join(""):`<p class="empty">${unv.length?"このエリアでT/Kが紹介した店はまだありません":"該当する店がありません"}</p>`)+
    (unv.length?`<p class="count sect">まだ行っていない店 ${unv.length}軒<span>メディアで紹介されている店</span></p>`+unv.map(itemHTML).join(""):"");
}
const areaShops=()=>order(shops.filter(s=>s.a===state.area));
const numbered=()=>state.tab==="list"&&state.area!=="すべて";
let map=null, markerLayer=null, fittedArea=null;
function initMap(){
  if(map||typeof L==="undefined") return;
  map=L.map("mapbox",{zoomControl:false});
  L.control.zoom({position:"topright"}).addTo(map);
  const tiles=L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{minZoom:5,maxZoom:18,
    attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">地理院タイル</a>'}).addTo(map);
  let errors=0; tiles.on("tileerror",()=>{ if(++errors===3) $("mapnote").hidden=false; });
  markerLayer=L.layerGroup().addTo(map);
  map.setView([35.33,139.55],11);
}
function updateMap(vis){
  initMap(); if(!map) return;
  map.invalidateSize();
  markerLayer.clearLayers();
  const all=state.area==="すべて"?order(shops):areaShops(), visIds=new Set(vis.map(s=>s.id));
  all.slice().reverse().forEach((s,ri)=>{
    if(s.lat==null) return;
    const i=all.length-1-ri, n=numbered()?i+1:"";
    const cls="mk"+(s.f?" pick":"")+(s.u?" unv":"")+(n?"":" dot")+(visIds.has(s.id)?"":" dim");
    const size=s.f?(n?32:20):s.u?(n?22:12):(n?26:16);
    const icon=L.divIcon({className:"",html:`<div class="${cls}">${n}</div>`,iconSize:[size,size],iconAnchor:[size/2,size/2]});
    L.marker([s.lat,s.lng],{icon,title:s.n,alt:s.n,zIndexOffset:s.f?1000:0}).on("click",()=>{location.hash="shop-"+s.id}).addTo(markerLayer);
  });
  if(fittedArea!==state.area){
    fittedArea=state.area;
    const pts=all.filter(s=>s.lat!=null).map(s=>[s.lat,s.lng]);
    if(pts.length===1) map.setView(pts[0],15);
    else if(pts.length) map.fitBounds(pts,{padding:[28,28],maxZoom:16});
  }
}
function renderArticles(){
  $("content").innerHTML=`<p class="count">${kanaArts.length}本</p>`+kanaArts.map(a=>{
    const linked=shops.filter(s=>s.arts.includes(a.k));
    const areas=[...new Set(linked.map(s=>s.a))];
    return `<div class="art">
      <span class="date">${esc(a.d)}${areas.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</span>
      <span class="art-t">${esc(a.t.split("｜")[0])}${a.t.includes("｜")?`<br><span class="meta">${esc(a.t.split("｜")[1])}</span>`:""}</span>
      <span class="acts"><a class="mini" href="${NU(a.k)}" target="_blank" rel="noopener">読む ↗</a>${
        linked.length>1?`<button class="mini go" data-area-go="${esc(areas[0])}">店を見る</button>`:linked[0]?`<button class="mini go" data-shop="${linked[0].id}">店を見る</button>`:""}</span>
    </div>`}).join("");
}
function renderFavs(){
  const list=order(shops.filter(s=>favs.has(s.id)));
  $("content").innerHTML=`<p class="count">${list.length}軒</p>`+
    (list.length?list.map(itemHTML).join(""):`<p class="empty">♡を押した店がここに並びます</p>`);
}
function render(){
  document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-current",t.dataset.tab===state.tab?"page":"false"));
  $("filters").hidden=state.tab!=="list";
  $("mapwrap").hidden=state.tab!=="list";
  if(state.tab==="list"){renderAreas();renderList();}
  else if(state.tab==="articles") renderArticles();
  else renderFavs();
  document.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",state.f[c.dataset.f]));
}

// ---- 店の特徴から描くイラスト（写真の代わり） ----
function seeded(n){let x=n*9301+49297;return()=>{x=(x*9301+49297)%233280;return x/233280}}
function illust(s){
  const T=s.t.join(" ")+s.m+s.z+s.a;
  const deep=/深煎り|直火/.test(T)&&!/浅煎り/.test(T), light=/浅煎り|フルーティ|果実/.test(T)&&!deep;
  const bg=deep?"#3E271B":light?"#D8B58C":"#7A4B30", ground=deep?"#2E1C13":light?"#C49E73":"#5F3A25";
  const lineC=light?"#3E271B":"#F3E6D6";
  const sea=/由比|葉山|海|森戸/.test(s.z+s.m), roof=/北鎌倉|古民家|山ノ内/.test(T), city=/横浜/.test(T);
  const rnd=seeded(s.id);
  let g=`<rect width="360" height="170" fill="${bg}"/>`;
  // 背景の景色
  if(city) g+=[[18,70,26,60],[48,50,22,80],[74,82,30,48],[272,60,24,70],[300,40,28,90],[332,76,22,54]].map(([x,y,w,h])=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${ground}" opacity=".75"/>`).join("");
  if(roof) g+=`<rect x="26" y="88" width="82" height="42" fill="${ground}" opacity=".8"/><path d="M14 92 L67 58 L120 92 Z" fill="${ground}"/><rect x="58" y="104" width="18" height="26" fill="${bg}" opacity=".6"/>`;
  g+=`<rect y="128" width="360" height="42" fill="${ground}"/>`;
  if(sea) g+=`<path d="M0 140 Q30 132 60 140 T120 140 T180 140 T240 140 T300 140 T360 140 V170 H0Z" fill="#5F8FA3"/><path d="M0 152 Q30 145 60 152 T120 152 T180 152 T240 152 T300 152 T360 152" fill="none" stroke="#DCEBF0" stroke-width="2" opacity=".8"/>`;
  // 豆
  for(let i=0;i<6;i++){const left=i%2===0, x=left?20+rnd()*90:250+rnd()*90, y=16+rnd()*52, r=Math.round(rnd()*180);
    g+=`<g transform="translate(${x.toFixed(0)} ${y.toFixed(0)}) rotate(${r})"><ellipse rx="7" ry="10" fill="${lineC}" opacity=".22"/><path d="M0 -8 Q-3 0 0 8" stroke="${bg}" stroke-width="1.6" fill="none" opacity=".6"/></g>`;}
  // カップ（共通）
  const cup=(top="#2B1A12",art="")=>`<ellipse cx="180" cy="128" rx="48" ry="7" fill="#EDE3D4"/><path d="M146 94 h68 v8 q0 30 -34 30 q-34 0 -34 -30z" fill="#F7F1E8"/><path d="M213 102 q16 0 16 11 q0 11 -17 11" fill="none" stroke="#F7F1E8" stroke-width="6"/><ellipse cx="180" cy="94" rx="34" ry="6" fill="${top}"/>${art}`;
  const steam=`<g fill="none" stroke="${lineC}" stroke-width="2.4" stroke-linecap="round" opacity=".55"><path d="M168 84 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M182 82 q-6 -8 0 -16 q6 -8 0 -16"/><path d="M196 84 q-6 -8 0 -16 q6 -8 0 -16"/></g>`;
  let main, note;
  if(/焙煎所|ロースター|直火焙煎|注文焙煎/.test(s.t.join(" ")+s.m)&&!/ネル/.test(s.t.join(" "))){
    main=`<path d="M160 36 h40 l-8 22 h-24z" fill="#C9A25A"/><rect x="138" y="58" width="88" height="52" rx="26" fill="#2F2E33"/><circle cx="138" cy="84" r="16" fill="#C9A25A"/><circle cx="138" cy="84" r="8" fill="#2F2E33"/><rect x="226" y="78" width="16" height="10" rx="3" fill="#C9A25A"/><path d="M150 110 l-6 18 M214 110 l6 18" stroke="#2F2E33" stroke-width="5"/><ellipse cx="110" cy="124" rx="28" ry="6" fill="#2F2E33"/><ellipse cx="110" cy="121" rx="24" ry="4" fill="#6B3E26"/>`;
    note="焙煎機";
  }else if(/ネル/.test(T)){
    main=cup()+`<path d="M120 44 H156" stroke="#C9A25A" stroke-width="4" stroke-linecap="round"/><ellipse cx="180" cy="44" rx="24" ry="5" fill="none" stroke="#C9A25A" stroke-width="3"/><path d="M156 44 Q160 72 180 80 Q200 72 204 44 Z" fill="#EFE6D6"/><path d="M180 80 v10" stroke="#2B1A12" stroke-width="3" stroke-dasharray="3 4"/>`;
    note="ネルドリップ";
  }else if(/スタンド|テイクアウト/.test(T)){
    main=`<ellipse cx="180" cy="129" rx="30" ry="4" fill="${ground}"/><path d="M158 70 H202 L196 128 H164 Z" fill="#F7F1E8"/><rect x="153" y="60" width="54" height="12" rx="4" fill="#EDE3D4"/><path d="M161 92 H199 L197 110 H163 Z" fill="#C9A25A"/>`+steam.replace(/q-6 -8 0 -16 q6 -8 0 -16/g,"q-5 -6 0 -12").replace(/M(\d+) 8\d/g,(m,x)=>`M${x} 56`);
    note="スタンド";
  }else if(/ラテ|ミルク/.test(T)){
    main=cup("#C89A6A",`<path d="M180 99 c-7 -4 -10 -9 -5 -11 c3 -1 5 1 5 3 c0 -2 2 -4 5 -3 c5 2 2 7 -5 11z" fill="#F7F1E8"/>`)+steam;
    note="ラテ";
  }else{ main=cup()+steam; note="一杯"; }
  // 添えもの
  let side="";
  if(/ホットケーキ/.test(T)) side=`<ellipse cx="280" cy="126" rx="32" ry="6" fill="#EDE3D4"/><rect x="254" y="104" width="52" height="10" rx="5" fill="#D9A15A"/><rect x="254" y="113" width="52" height="10" rx="5" fill="#C98E46"/><rect x="272" y="99" width="14" height="6" rx="2" fill="#F6E7A8"/>`;
  else if(/チーズケーキ|ケーキ|スイーツ|プリン|パフェ|焼き菓子|sweets/.test(T)) side=`<path d="M252 128 H304 V104 Z" fill="#F2D9A8"/><path d="M252 128 L304 104 V110 L258 128 Z" fill="#E1B66C"/><ellipse cx="278" cy="129" rx="34" ry="4" fill="#EDE3D4"/>`;
  else if(/パン/.test(T)) side=`<ellipse cx="280" cy="116" rx="30" ry="14" fill="#C98E46"/><path d="M264 110 l8 10 M278 106 l8 12 M292 108 l6 10" stroke="#F2D9A8" stroke-width="3" stroke-linecap="round"/>`;
  else if(/豆販売|豆を|お土産/.test(T)) side=`<path d="M258 80 H300 L304 128 H254 Z" fill="#B88A5A"/><rect x="262" y="96" width="34" height="18" rx="2" fill="#F7F1E8"/><path d="M258 80 l6 -6 h30 l6 6" fill="#9C7046"/>`;
  return `<svg viewBox="0 0 360 170" role="img" aria-label="${esc(s.n)}のイラスト（${note}）" preserveAspectRatio="xMidYMid slice">${g}${main}${side}</svg>`;
}
function renderDetail(id){
  const s=shops.find(x=>x.id===id); if(!s){$("detail").hidden=true;return;}
  const fav=favs.has(s.id);
  const own=s.arts.map(k=>artByKey[k]).filter(Boolean);
  const others=DATA.rel.filter(r=>r.s===s.n&&String(r.show).toUpperCase()==="TRUE");
  const src=own[0];
  $("detail").innerHTML=`
    <div class="d-top"><button class="back" id="back">← 戻る</button><span class="sub">${esc(s.a)}</span></div>
    <div class="d-body">
      <div class="hero">${illust(s)}</div>
      <h1 class="d-name">${esc(s.n)}</h1>
      <div class="btns">
        <a class="btn primary" href="${dirURL(s)}" target="_blank" rel="noopener">経路</a>
        <a class="btn" href="${mapsURL(s)}" target="_blank" rel="noopener">マップ ↗</a>
        <button class="btn" id="favbtn" aria-pressed="${fav}" aria-label="お気に入り">${fav?"♥":"♡"}</button>
      </div>
      ${s.u?`<div>
        <dl class="rows"><div><dt>住所</dt><dd>${esc(s.ad)}</dd></div></dl>
        <p class="fine">営業時間は「マップ」で確認してください${s.lat==null?"。地図上の位置はまだ登録していません":""}</p>
      </div>
      <div class="unv-note">
        <p class="h" style="margin:0">まだ行っていない店</p>
        <span>${esc(s.m)}</span>
        <div class="tags">${s.t.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
        <span class="fine" style="margin:0">T/K Coffee Log ではまだ紹介していない店です。下の紹介記事をもとに載せています。</span>
      </div>`:`<div>
        <dl class="rows">
          <div><dt>営業</dt><dd>${esc(s.hrs||"—")}</dd></div>
          <div><dt>定休</dt><dd>${esc(s.cl||"—")}</dd></div>
          <div><dt>アクセス</dt><dd>${esc(s.acc||"—")}</dd></div>
        </dl>
        <p class="fine">${esc(src?.d||"")} 時点。最新はマップで${String(s.prec||"").startsWith("おおよそ")?"。地図上の位置はおおよそです":""}</p>
      </div>
      <div class="mine">
        ${s.f?`<span class="flag">★ ${esc(s.f)}</span>`:""}
        <span>${esc(s.m)}</span>
        ${s.tk?`<span class="tk">T/K評価　${esc(s.tk)}</span>`:""}
        <div class="tags">${s.t.map(t=>`<span>${esc(t)}</span>`).join("")}</div>
      </div>`}
      <div class="rel">
        <p class="h" style="margin:0">関連記事</p>
        ${own.map(a=>`<a class="card" href="${NU(a.k)}" target="_blank" rel="noopener"><b>${esc(a.t.split("｜")[0])} ↗</b><small>${esc(a.d)}</small></a>`).join("")}
        ${others.length?`<span class="rel-g"><i class="dot other"></i>${s.u?"紹介記事":"ほかの人の記事"}</span>`+others.map(o=>`<a class="card other" href="${esc(o.u)}" target="_blank" rel="noopener"><b>${esc(o.t)} ↗</b><small>${esc(o.site)}</small></a>`).join(""):""}
        <a class="more" href="https://www.google.com/search?q=${encodeURIComponent(s.n+" "+s.a+" コーヒー")}" target="_blank" rel="noopener">もっと探す ↗</a>
      </div>
    </div>`;
  $("detail").hidden=false;
  $("detail").querySelector(".d-body").scrollTop=0;
  $("back").addEventListener("click",()=>{ if(location.hash) history.back(); else $("detail").hidden=true; });
  $("favbtn").addEventListener("click",()=>{favs.has(s.id)?favs.delete(s.id):favs.add(s.id);store.set("cm-favs",[...favs]);renderDetail(s.id);render();});
}
function route(){
  const m=location.hash.match(/^#shop-(\d+)$/);
  if(m) renderDetail(+m[1]); else $("detail").hidden=true;
}
document.addEventListener("click",e=>{
  const sh=e.target.closest("[data-shop]"); if(sh){location.hash="shop-"+sh.dataset.shop;return;}
  const ar=e.target.closest("[data-area]"); if(ar){state.area=ar.dataset.area;store.set("cm-area",state.area);render();$("main").scrollTop=0;return;}
  const ag=e.target.closest("[data-area-go]"); if(ag){state.area=ag.dataset.areaGo;state.tab="list";render();$("main").scrollTop=0;return;}
  const ch=e.target.closest(".chip"); if(ch){state.f[ch.dataset.f]=!state.f[ch.dataset.f];render();return;}
  const tb=e.target.closest(".tab"); if(tb){state.tab=tb.dataset.tab;render();$("main").scrollTop=0;}
});
window.addEventListener("hashchange",route);
render(); route();
</script>
